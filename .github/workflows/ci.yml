name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      KXIAN_MODE: paper
      KXIAN_MARKET_DATA_SOURCE: sqlite
      KXIAN_ALLOW_LIVE: "false"
      KXIAN_ENABLE_LIVE_AUTOTRADE: "false"
      KXIAN_LIVE_DRY_RUN: "true"
      KXIAN_ENABLE_TESTNET_AUTOTRADE: "false"
      KXIAN_LIVE_CONFIRMATION: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Install browser test runtime
        run: python -m playwright install --with-deps chromium
      - name: Compile
        run: python -m compileall src/kxian_bot
      - name: Secret scan
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env$|\.env\..+|\.envrc$|\.npmrc$|\.pypirc$|\.netrc$|id_(rsa|dsa|ecdsa|ed25519)$|terraform\.tfvars$|.*\.tfstate$|credentials\.json$|service-account.*\.json$|.*\.(pem|key|p8|p12|pfx|jks|sqlite3|db)$|data/|artifacts/)' | grep -Ev '(^|/)\.env(\.testnet)?\.example$'; then
            echo "Tracked runtime secret, database, data, or artifact file found."
            exit 1
          fi
          if git grep -IEn '(AKIA[0-9A-Z]{16}|xox[baprs]-[0-9A-Za-z-]{10,}|-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----)' -- .; then
            echo "High-confidence secret pattern found."
            exit 1
          fi
      - name: Test
        run: python -m pytest -v
      - name: Offline smoke
        run: kxian-bot paper-dry-run --input-file sample_data/ohlcv_smoke.csv --max-iterations 1 --sleep-seconds 0
